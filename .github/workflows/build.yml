name: Build Koji APK

on:
  push:
    branches:
      - koji-features-v2
  workflow_dispatch:
    inputs:
      tag:
        description: "Azahar release tag to build (blank = newest release)"
        required: false
        default: ""
      abis:
        description: "Comma-separated ABIs to build (blank = arm64-v8a). Use arm64-v8a,x86_64 for emulators."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: koji-apk-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}/azahar
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      MAKEFLAGS: -j4
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4
      # Native compilation dominates the build, so only the ABI(s) we actually ship are
      # compiled. Blank/arm64-v8a builds the phone APK; arm64-v8a,x86_64 restores the
      # universal APK used for emulators (at roughly double the native build cost).
      KOJI_ABIS: ${{ inputs.abis }}
      # Keep Gradle's JVM heap large enough to avoid memory pressure during Kotlin/native builds.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8

    steps:
      - name: Checkout Koji builder
        uses: actions/checkout@v4

      - name: Find Azahar version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/azahar-emu/azahar/releases/latest --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Koji from Azahar $TAG"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache keys are content-addressed (tag + patch/branding hash) instead of per-run.
      # A unique key per run would write a fresh multi-gigabyte entry on every build and
      # push older entries out of the repository's 10 GB cache budget, which evicts the
      # very caches that make repeat builds fast.
      - name: Restore Gradle dependency and build caches
        uses: actions/cache@v4
        with:
          path: |
            .gradle-cache/caches
            .gradle-cache/wrapper
          key: koji-gradle-${{ runner.os }}-jdk17-${{ steps.ver.outputs.tag }}
          restore-keys: |
            koji-gradle-${{ runner.os }}-jdk17-
            koji-gradle-${{ runner.os }}-

      - name: Restore Android CMake package
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/cmake/3.30.3
          key: koji-cmake-${{ runner.os }}-3.30.3

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: koji-ccache-${{ runner.os }}-${{ steps.ver.outputs.tag }}-${{ hashFiles('azahar-custom.patch', 'koji-branding.sh') }}
          restore-keys: |
            koji-ccache-${{ runner.os }}-${{ steps.ver.outputs.tag }}-
            koji-ccache-${{ runner.os }}-

      - name: Download Azahar source (with submodules)
        run: git clone --recursive --depth 1 --shallow-submodules --branch "${{ steps.ver.outputs.tag }}" https://github.com/azahar-emu/azahar azahar

      - name: Validate Koji emulator patch
        working-directory: azahar
        run: |
          set -euo pipefail
          patch --dry-run --batch -p1 < ../azahar-custom.patch

      - name: Apply Koji emulator patch
        working-directory: azahar
        run: |
          set -euo pipefail
          patch --batch -p1 --no-backup-if-mismatch < ../azahar-custom.patch
          if find . -name '*.rej' | grep -q .; then
            echo "::error::Patch does not apply cleanly to ${{ steps.ver.outputs.tag }}. Choose a compatible tag or update the patch."
            find . -name '*.rej'
            exit 1
          fi

      - name: Apply Koji branding and carousel UI
        run: |
          chmod +x koji-branding.sh
          ./koji-branding.sh

      - name: Restore native build intermediates
        uses: actions/cache@v4
        with:
          path: |
            azahar/src/android/.cxx
            azahar/src/android/app/.cxx
            azahar/src/android/app/build/intermediates/cxx
          key: koji-native-${{ runner.os }}-${{ steps.ver.outputs.tag }}-${{ hashFiles('azahar-custom.patch', 'koji-branding.sh') }}
          restore-keys: |
            koji-native-${{ runner.os }}-${{ steps.ver.outputs.tag }}-

      - name: Install build tools
        run: |
          if ! command -v ccache >/dev/null 2>&1 || ! command -v apksigner >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ccache apksigner
          fi
          if [ ! -x "${ANDROID_SDK_ROOT}/cmake/3.30.3/bin/cmake" ]; then
            echo "Installing Android CMake 3.30.3"
            echo "y" | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.3"
          fi
          ccache --zero-stats
          ccache --show-stats

      - name: Build APK
        working-directory: azahar
        env:
          NDK_CCACHE: /usr/bin/ccache
        run: |
          cd src/android
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --build-cache --parallel --max-workers=4 assembleVanillaRelease 2>&1 \
            | tee "$GITHUB_WORKSPACE/koji-build.log"

      # Build logs need a signed-in repository admin to view, so on failure the interesting part of
      # the Gradle output is republished where anyone can read it: as an annotation and in the run
      # summary. This makes a red run diagnosable without repository access.
      - name: Publish build log on failure
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/koji-build.log"
          if [ ! -f "$LOG" ]; then
            echo "No build log was captured."
            exit 0
          fi
          SNIP=$(grep -n -i -E '^e: |^w: .*(error)|error:|FAILURE:|What went wrong|Caused by:|Execution failed|not found' "$LOG" | head -40 || true)
          if [ -z "$SNIP" ]; then
            SNIP=$(tail -40 "$LOG")
          fi
          ESCAPED=$(printf '%s' "$SNIP" | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failure::${ESCAPED}"
          {
            echo "### Koji build log (last 300 lines)"
            echo '```'
            tail -300 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          else
            echo "ccache was not installed; no compiler-cache statistics available."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: koji-${{ steps.ver.outputs.tag }}
          path: azahar/src/android/app/build/outputs/apk/vanilla/release/*.apk
          if-no-files-found: error
          retention-days: 14
