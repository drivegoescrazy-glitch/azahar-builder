name: Build patched Azahar APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Azahar release tag to build (blank = newest release)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (contains azahar-custom.patch)
        uses: actions/checkout@v4

      - name: Find Azahar version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/azahar-emu/azahar/releases/latest --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Azahar $TAG"

      - name: Download Azahar source (with submodules)
        run: git clone --recursive --depth 1 --branch "${{ steps.ver.outputs.tag }}" https://github.com/azahar-emu/azahar azahar

      - name: Apply patch
        working-directory: azahar
        run: |
          patch -p1 --no-backup-if-mismatch < ../azahar-custom.patch
          if find . -name '*.rej' | grep -q .; then
            echo "::error::Patch does not apply cleanly to ${{ steps.ver.outputs.tag }}. Re-run with tag 2126.2 or ask for an updated patch."
            find . -name '*.rej'
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"

      - name: Build APK
        working-directory: azahar
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          export NDK_CCACHE=$(which ccache)
          cd src/android
          chmod +x ./gradlew
          ./gradlew assembleVanillaRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azahar-patched-${{ steps.ver.outputs.tag }}
          path: azahar/src/android/app/build/outputs/apk/vanilla/release/*.apk
